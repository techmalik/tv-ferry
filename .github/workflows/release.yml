name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app (Apple Silicon + Intel)
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent "dist/TV Ferry.app" "TV-Ferry-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "TV-Ferry-${GITHUB_REF_NAME}.zip" --title "TV Ferry ${GITHUB_REF_NAME}" --generate-notes
