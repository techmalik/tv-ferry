<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="0.55" stop-color="#E0457B"/>
      <stop offset="1" stop-color="#6A3DE8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1A5C"/>
      <stop offset="1" stop-color="#140B33"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A0F4A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- TV -->
  <g filter="url(#shadow)">
    <rect x="222" y="232" width="580" height="400" rx="58" fill="#FFF7F2"/>
    <rect x="260" y="270" width="504" height="324" rx="32" fill="url(#screen)"/>
  </g>
  <!-- arrow dropping into the screen -->
  <g stroke="url(#arrow)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M512 322 V500"/>
    <path d="M438 430 L512 504 L586 430"/>
  </g>
  <rect x="402" y="534" width="220" height="22" rx="11" fill="#FFD36E" opacity="0.9"/>
  <!-- couch in front of the TV -->
  <g filter="url(#shadow)">
    <rect x="322" y="650" width="184" height="104" rx="36" fill="#2A1A5E"/>
    <rect x="518" y="650" width="184" height="104" rx="36" fill="#2A1A5E"/>
    <rect x="322" y="730" width="380" height="80" rx="24" fill="#1B1038"/>
    <rect x="268" y="694" width="96" height="134" rx="42" fill="#1B1038"/>
    <rect x="660" y="694" width="96" height="134" rx="42" fill="#1B1038"/>
    <rect x="296" y="814" width="30" height="34" rx="8" fill="#1B1038"/>
    <rect x="698" y="814" width="30" height="34" rx="8" fill="#1B1038"/>
  </g>
</svg>
